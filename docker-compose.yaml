services:
  db:
    image: postgres:14.3
    container_name: phrasedb
    restart: always
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USERNAME: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}  
    volumes:
      - ./postgres:/var/lib/postgresql/data